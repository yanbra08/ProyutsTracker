<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Tracker | Registrarse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <button class="theme-switch" id="btn-theme" title="Cambiar tema">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            
            <h1>Registrarse</h1>
            <p class="subtitle">Crea tu cuenta de estudiante</p>

            <form id="form-registro">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="reg-nombre" class="form-control" placeholder="Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-correo" class="form-control" placeholder="estudiante@universidad.edu" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-pass" class="form-control" placeholder="Mínimo 8 caracteres" minlength="8" required>
                        <i class="fa-regular fa-eye toggle-password" id="btn-ver-pass"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-semestre">Semestre Académico</label>
                    <select id="reg-semestre" class="form-control" required style="width: 100%; padding: 10px; border-radius: 6px; cursor: pointer;">
                        <option value="1">Primer Semestre</option>
                        <option value="2">Segundo Semestre</option>
                        <option value="3">Tercer Semestre</option>
                        <option value="4">Cuarto Semestre</option>
                        <option value="5">Quinto Semestre</option>
                        <option value="6">Sexto Semestre</option>
                    </select>
                </div>

               <div class="form-actions">
    <button type="submit" id="btn-registrar" class="btn-dark">Registrarse</button>
    <button type="reset" class="btn-light">Limpiar</button>
</div>
            </form>

            <div class="auth-footer">
                <a href="../Login/Login.html">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </div>

    <script type="module" src="Register.js"></script>
</body>
</html>
